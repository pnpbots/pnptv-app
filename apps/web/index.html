<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PNPtv!" />

    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PNPtv!" />
    <meta name="twitter:description" content="PNPtv! is a private social platform for gay men into the party and play lifestyle. Live video rooms, nearby discovery, creator channels, and premium content." />
    <meta name="twitter:image" content="https://app.pnptv.app/og-image.png" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PNPtv!" />

    <!-- Fonts — non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link href="https://fonts.cdnfonts.com/css/ethnocentric" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
      <link href="https://fonts.cdnfonts.com/css/ethnocentric" rel="stylesheet" />
    </noscript>

    <!-- Telegram Web App SDK — async to avoid blocking render -->
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PNPtv!",
      "alternateName": "PNPtv!",
      "url": "https://app.pnptv.app",
      "description": "PNPtv! is a private social platform built for gay men into the party and play lifestyle. Connect, stream, and share content in a secure adult community.",
      "image": "https://app.pnptv.app/og-image.png",
      "publisher": {
        "@type": "Organization",
        "name": "PNPtv!",
        "url": "https://pnptv.app",
        "logo": {
          "@type": "ImageObject",
          "url": "https://app.pnptv.app/icon-512.png",
          "width": 512,
          "height": 512
        }
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://app.pnptv.app/social?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "PNPtv!",
      "operatingSystem": "Web",
      "applicationCategory": "SocialNetworkingApplication",
      "description": "Private social platform for gay men into the party and play lifestyle. Live video rooms, creator channels, nearby discovery, and premium adult content.",
      "url": "https://app.pnptv.app",
      "image": "https://app.pnptv.app/og-image.png",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Personal profiles with posts and media sharing",
        "Real-time live video rooms and group conversations",
        "Nearby discovery to connect with people in your area",
        "Creator channels, podcasts, and curated playlists",
        "Premium content available to subscribed members",
        "Secure login with Telegram and social identity providers"
      ]
    }
    </script>

  </head>
  <body class="bg-pnp-background text-pnp-textPrimary antialiased">
    <div id="root"></div>

    <!-- Splash screen — shown until React mounts, then fades out -->
    <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a14;transition:opacity .4s ease-out,visibility .4s ease-out">
      <!-- Animated gradient glow behind the logo -->
      <div style="position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(212,0,122,.25) 0%,rgba(230,145,56,.15) 40%,transparent 70%);animation:splash-pulse 2s ease-in-out infinite;filter:blur(40px)"></div>
      <!-- Logo -->
      <img src="/icon-512.png" alt="PNPtv!" width="120" height="120" style="position:relative;z-index:1;animation:splash-logo .6s cubic-bezier(.22,1,.36,1) both" />
      <!-- Tagline -->
      <p style="position:relative;z-index:1;margin-top:20px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.45);animation:splash-text .6s .2s cubic-bezier(.22,1,.36,1) both">PNPtv!</p>
      <!-- Loading bar -->
      <div style="position:relative;z-index:1;margin-top:28px;width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden">
        <div style="width:40%;height:100%;border-radius:2px;background:linear-gradient(90deg,#D4007A,#E69138);animation:splash-bar 1.2s ease-in-out infinite"></div>
      </div>
      <style>
        @keyframes splash-pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.15);opacity:1}}
        @keyframes splash-logo{from{opacity:0;transform:scale(.8) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
        @keyframes splash-text{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes splash-bar{0%{transform:translateX(-100%)}50%{transform:translateX(150%)}100%{transform:translateX(150%)}}
        #splash.hide{opacity:0;visibility:hidden}
      </style>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
