<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="PNPtv! — Exclusive PNP Content, Live Streams & Community" />

    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Watch exclusive videos, join live streams, discover nearby members, and connect with creators on the PNPtv community platform." />
    <meta name="twitter:image" content="https://app.pnptv.app/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

      "@context": "https://schema.org",

      "name": "PNPtv!",
      "url": "https://app.pnptv.app",

        "name": "PNPtv!",
        "url": "https://pnptv.app",
        "logo": {
          "@type": "ImageObject",

  <body class="bg-pnp-background text-pnp-textPrimary antialiased">
