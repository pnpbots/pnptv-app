# ============================================
# PNPTVAPP - Docker Compose Stack v5
# "Moat & Castle" Zero-Trust Architecture
# 3 networks | named volumes | resource limits
# ============================================
#
# Network topology (databases NEVER on proxy_net):
#   proxy_net  → NPM ↔ app services (internet-facing)
#   app_net    → inter-service communication
#   db_net     → database isolation (no proxy access)
#
# Named volumes backed by existing host paths for
# zero-downtime migration and WAL-G readiness.
# ============================================

networks:
  pnptvapp_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================
# Named volumes — backed by existing host dirs
# for zero-downtime migration from bind mounts.
# docker volume ls now shows all data stores.
# ============================================
volumes:
  vol_pg_pnptv:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/pnptv/postgres
  vol_pg_pnptv_wal:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/pnptv/wal
  vol_redis_pnptv:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/pnptv/redis
  vol_pg_authentik:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/authentik/postgres
  vol_redis_authentik:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/authentik/redis
  vol_pg_directus:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/directus/postgres
  vol_pg_calcom:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/calcom/postgres
  vol_redis_calcom:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/calcom/redis
  vol_pg_synapse:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/synapse/postgres
  vol_pg_mautrix_telegram:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/mautrix-telegram/postgres
  vol_pg_pnptv_walg_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/pnptv/walg-backups
  vol_pg_btcpay:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/btcpay/postgres
  vol_pg_listmonk:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/listmonk/postgres
  vol_pg_fider:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/fider/postgres
  vol_pg_infisical:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/infisical/postgres
  vol_pg_hoppscotch:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/pnptvapp/infrastructure/data/hoppscotch/postgres

services:

  # ===========================================
  # BLOCK 0 - Docker Socket Proxy
  # Read-only access for monitoring tools.
  # NEVER on proxy_net — internal only.
  # ===========================================

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    privileged: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Read-only operations
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      NETWORKS: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      # Dangerous operations — all disabled
      POST: 0
      BUILD: 0
      COMMIT: 0
      EXEC: 0
      IMAGES: 0
      VOLUMES: 0
      AUTH: 0
      SECRETS: 0
      SWARM: 0
      NODES: 0
      PLUGINS: 0
      SYSTEM: 0
      DISTRIBUTION: 0
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:2375/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================
  # BLOCK 0.1 - Docker Socket Proxy (RW)
  # Write-access proxy for Dockge stack manager.
  # POST/DELETE enabled — scoped to Dockge only.
  # Never expose to internet-facing services.
  # ===========================================

  docker-socket-proxy-rw:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy-rw
    restart: unless-stopped
    privileged: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Read operations
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      NETWORKS: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      IMAGES: 1
      VOLUMES: 1
      # Write operations — required for Dockge compose management
      POST: 1
      DELETE: 1
      # Dangerous operations — disabled
      BUILD: 0
      COMMIT: 0
      EXEC: 0
      AUTH: 0
      SECRETS: 0
      SWARM: 0
      NODES: 0
      PLUGINS: 0
      SYSTEM: 0
      DISTRIBUTION: 0
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:2375/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================
  # BLOCK A - Reverse Proxy (Entry Point)
  # ONLY container exposing HTTP/S ports.
  # Lives exclusively on proxy_net — cannot
  # reach any database directly.
  # ===========================================

  npm-proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infrastructure/data/npm/data:/data
      - ./infrastructure/data/npm/letsencrypt:/etc/letsencrypt
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:81/api/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ===========================================
  # BLOCK B - Identity & SSO (Authentik)
  # Redis required for cache/sessions
  # ===========================================

  redis-authentik:
    image: redis:7-alpine
    container_name: redis-authentik
    restart: unless-stopped
    volumes:
      - vol_redis_authentik:/data
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pg-authentik:
    image: postgres:16-alpine
    container_name: pg-authentik
    restart: unless-stopped
    volumes:
      - vol_pg_authentik:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_AUTH_DB}
      POSTGRES_USER: ${PG_AUTH_USER}
      POSTGRES_PASSWORD: ${PG_AUTH_PASSWORD}
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_AUTH_USER} -d ${PG_AUTH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-server
    restart: unless-stopped
    command: server
    volumes:
      - ./infrastructure/data/authentik/media:/media
      - ./infrastructure/data/authentik/custom-templates:/templates
    environment:
      AUTHENTIK_POSTGRESQL__HOST: pg-authentik
      AUTHENTIK_POSTGRESQL__NAME: ${PG_AUTH_DB}
      AUTHENTIK_POSTGRESQL__USER: ${PG_AUTH_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_AUTH_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING}
      AUTHENTIK_REDIS__HOST: redis-authentik
    networks:
      - pnptvapp_net
    labels:
      traefik.enable: "true"
      traefik.docker.network: "pnptvapp_pnptvapp_net"
      traefik.http.routers.authentik.rule: "Host(`auth.pnptv.app`)"
      traefik.http.routers.authentik.entrypoints: "websecure"
      traefik.http.routers.authentik.tls.certresolver: "letsencrypt"
      traefik.http.services.authentik.loadbalancer.server.port: "9000"
    depends_on:
      pg-authentik:
        condition: service_healthy
      redis-authentik:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/-/health/live/')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    volumes:
      - ./infrastructure/data/authentik/media:/media
      - ./infrastructure/data/authentik/custom-templates:/templates
    environment:
      AUTHENTIK_POSTGRESQL__HOST: pg-authentik
      AUTHENTIK_POSTGRESQL__NAME: ${PG_AUTH_DB}
      AUTHENTIK_POSTGRESQL__USER: ${PG_AUTH_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_AUTH_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING}
      AUTHENTIK_REDIS__HOST: redis-authentik
    networks:
      - pnptvapp_net
    depends_on:
      pg-authentik:
        condition: service_healthy
      redis-authentik:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  # Authentik proxy outpost (forward auth for NPM admin + Ampache)
  authentik-outpost:
    image: ghcr.io/goauthentik/proxy:2025.2.4
    container_name: authentik-outpost
    restart: unless-stopped
    ports:
      - "9100:9000"
      - "9444:9443"
    environment:
      AUTHENTIK_HOST: http://authentik-server:9000
      AUTHENTIK_INSECURE: "true"
      AUTHENTIK_TOKEN: ${AUTHENTIK_OUTPOST_TOKEN}
      AUTHENTIK_REDIS__HOST: redis-authentik
    networks:
      - pnptvapp_net
    depends_on:
      authentik-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/outpost.goauthentik.io/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================
  # BLOCK C - Data & CRM (Directus)
  # Separate PostgreSQL for security isolation
  # ===========================================

  pg-directus:
    image: postgres:16-alpine
    container_name: pg-directus
    restart: unless-stopped
    volumes:
      - vol_pg_directus:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DIRECTUS_DB}
      POSTGRES_USER: ${PG_DIRECTUS_USER}
      POSTGRES_PASSWORD: ${PG_DIRECTUS_PASSWORD}
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DIRECTUS_USER} -d ${PG_DIRECTUS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  directus:
    image: directus/directus:latest
    container_name: directus
    restart: unless-stopped
    volumes:
      - ./infrastructure/data/directus/uploads:/directus/uploads
      - ./infrastructure/data/directus/extensions:/directus/extensions
    environment:
      DB_CLIENT: pg
      DB_HOST: pg-directus
      DB_PORT: "5432"
      DB_DATABASE: ${PG_DIRECTUS_DB}
      DB_USER: ${PG_DIRECTUS_USER}
      DB_PASSWORD: ${PG_DIRECTUS_PASSWORD}
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASS}
      PUBLIC_URL: https://cms.${DOMAIN_ROOT}
      AUTH_PROVIDERS: "authentik"
      AUTH_AUTHENTIK_DRIVER: "openid"
      AUTH_AUTHENTIK_CLIENT_ID: ${DIRECTUS_OIDC_CLIENT_ID}
      AUTH_AUTHENTIK_CLIENT_SECRET: ${DIRECTUS_OIDC_CLIENT_SECRET}
      AUTH_AUTHENTIK_ISSUER_URL: "https://auth.${DOMAIN_ROOT}/application/o/directus/.well-known/openid-configuration"
      AUTH_AUTHENTIK_IDENTIFIER_KEY: "sub"
      AUTH_AUTHENTIK_ALLOW_PUBLIC_REGISTRATION: "false"
      AUTH_AUTHENTIK_ICON: "lock"
      AUTH_AUTHENTIK_LABEL: "Sign in with PNPTV"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
      FILES_MAX_SIZE: "2147483648"
      MAX_PAYLOAD_SIZE: "2gb"
    networks:
      - pnptvapp_net
    depends_on:
      pg-directus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8055/server/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ===========================================
  # BLOCK E - Booking (Cal.com)
  # Dedicated PostgreSQL + Redis for API v2
  # ===========================================

  pg-calcom:
    image: postgres:16-alpine
    container_name: pg-calcom
    restart: unless-stopped
    volumes:
      - vol_pg_calcom:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_CALCOM_DB}
      POSTGRES_USER: ${PG_CALCOM_USER}
      POSTGRES_PASSWORD: ${PG_CALCOM_PASSWORD}
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_CALCOM_USER} -d ${PG_CALCOM_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis-calcom:
    image: redis:7-alpine
    container_name: redis-calcom
    restart: unless-stopped
    volumes:
      - vol_redis_calcom:/data
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  calcom:
    image: calcom/cal.com:latest
    container_name: calcom
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${PG_CALCOM_USER}:${PG_CALCOM_PASSWORD}@pg-calcom:5432/${PG_CALCOM_DB}
      DATABASE_DIRECT_URL: postgresql://${PG_CALCOM_USER}:${PG_CALCOM_PASSWORD}@pg-calcom:5432/${PG_CALCOM_DB}
      NEXTAUTH_SECRET: ${CALCOM_NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALCOM_ENCRYPTION_KEY}
      NEXT_PUBLIC_WEBAPP_URL: https://booking.${DOMAIN_ROOT}
      NEXT_PUBLIC_APP_URL: https://booking.${DOMAIN_ROOT}
      NEXTAUTH_URL: https://booking.${DOMAIN_ROOT}
      REDIS_URL: redis://redis-calcom:6379
      CALCOM_LICENSE_KEY: ${CALCOM_LICENSE_KEY}
      OIDC_CLIENT_ID: ${CALCOM_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${CALCOM_OIDC_CLIENT_SECRET}
      OIDC_WELL_KNOWN_URL: "https://auth.${DOMAIN_ROOT}/application/o/calcom/.well-known/openid-configuration"
      NODE_ENV: production
      ALLOWED_HOSTNAMES: '["booking.${DOMAIN_ROOT}"]'
    networks:
      - pnptvapp_net
    depends_on:
      pg-calcom:
        condition: service_healthy
      redis-calcom:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================
  # BLOCK F - Social Feed (Bluesky PDS)
  # Internal SQLite - no external DB needed
  # ===========================================

  bluesky-pds:
    image: ghcr.io/bluesky-social/pds:latest
    container_name: bluesky-pds
    restart: unless-stopped
    volumes:
      - ./infrastructure/data/bluesky-pds:/pds
    environment:
      PDS_HOSTNAME: ${PDS_HOSTNAME}
      PDS_JWT_SECRET: ${PDS_JWT_SECRET}
      PDS_ADMIN_PASSWORD: ${PDS_ADMIN_PASSWORD}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${PDS_PLC_ROTATION_KEY}
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_DID_PLC_URL: https://plc.directory
      PDS_BSKY_APP_VIEW_URL: https://api.bsky.app
      PDS_BSKY_APP_VIEW_DID: did:web:api.bsky.app
      PDS_REPORT_SERVICE_URL: https://mod.bsky.app
      PDS_REPORT_SERVICE_DID: did:plc:ar7c4by46qjdydhdevvrndak
      PDS_CRAWLERS: https://bsky.network
      # PDS_EMAIL_FROM_ADDRESS: ${PDS_EMAIL_FROM_ADDRESS}
      # PDS_EMAIL_SMTP_URL: ${PDS_EMAIL_SMTP_URL}
      LOG_ENABLED: "true"
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/xrpc/_health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ===========================================
  # BLOCK G - Chat & Video Calls
  # Matrix Synapse + Element Web
  # ===========================================

  pg-synapse:
    image: postgres:16-alpine
    container_name: pg-synapse
    restart: unless-stopped
    volumes:
      - vol_pg_synapse:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_SYNAPSE_DB}
      POSTGRES_USER: ${PG_SYNAPSE_USER}
      POSTGRES_PASSWORD: ${PG_SYNAPSE_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SYNAPSE_USER} -d ${PG_SYNAPSE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: synapse
    restart: unless-stopped
    extra_hosts:
      - "auth.pnptv.app:host-gateway"
    volumes:
      - ./infrastructure/data/synapse/data:/data
    environment:
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME}
      SYNAPSE_REPORT_STATS: ${SYNAPSE_REPORT_STATS}
      SYNAPSE_CONFIG_DIR: /data
      UID: "991"
      GID: "991"
      # OIDC client credentials — interpolated by homeserver.yaml via %(VAR)s syntax
      SYNAPSE_OIDC_CLIENT_ID: ${SYNAPSE_OIDC_CLIENT_ID}
      SYNAPSE_OIDC_CLIENT_SECRET: ${SYNAPSE_OIDC_CLIENT_SECRET}
    networks:
      - pnptvapp_net
    labels:
      traefik.enable: "true"
      traefik.docker.network: "pnptvapp_pnptvapp_net"
      traefik.http.routers.synapse.rule: "Host(`matrix.pnptv.app`)"
      traefik.http.routers.synapse.entrypoints: "websecure"
      traefik.http.routers.synapse.tls.certresolver: "letsencrypt"
      traefik.http.services.synapse.loadbalancer.server.port: "8008"
    depends_on:
      pg-synapse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  pg-mautrix-telegram:
    image: postgres:16-alpine
    container_name: pg-mautrix-telegram
    restart: unless-stopped
    volumes:
      - vol_pg_mautrix_telegram:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mautrix_telegram
      POSTGRES_USER: mautrix_tg
      POSTGRES_PASSWORD: ${PG_MAUTRIX_TG_PASSWORD}
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mautrix_tg -d mautrix_telegram"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mautrix-telegram:
    image: dock.mau.dev/mautrix/telegram:latest
    container_name: mautrix-telegram
    restart: unless-stopped
    volumes:
      - ./infrastructure/data/mautrix-telegram/data:/data
    networks:
      - pnptvapp_net
    depends_on:
      synapse:
        condition: service_healthy
      pg-mautrix-telegram:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  element-web:
    image: vectorim/element-web:v1.12.8
    container_name: element-web
    restart: unless-stopped
    volumes:
      - ./infrastructure/configs/element/config.json:/usr/share/nginx/html/config.json
      - ./infrastructure/configs/element/default.conf.template:/etc/nginx/templates/default.conf.template
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-pnptv
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "7881:7881"
      - "50000-50060:50000-50060/udp"
      - "3478:3478/udp"
    volumes:
      - ./infrastructure/configs/livekit/livekit.yaml:/etc/livekit.yaml:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed -e "s|__LIVEKIT_API_KEY__|$${LIVEKIT_API_KEY}|g" \
            -e "s|__LIVEKIT_API_SECRET__|$${LIVEKIT_API_SECRET}|g" \
            /etc/livekit.yaml > /tmp/livekit.yaml && \
        exec /livekit-server --config /tmp/livekit.yaml
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048m
    labels:
      traefik.enable: "true"
      traefik.docker.network: "pnptvapp_pnptvapp_net"
      traefik.http.routers.livekit.rule: "Host(`livekit.pnptv.app`)"
      traefik.http.routers.livekit.entrypoints: "websecure"
      traefik.http.routers.livekit.tls.certresolver: "letsencrypt"
      traefik.http.services.livekit.loadbalancer.server.port: "7880"

  # ===========================================
  # BLOCK H - Live Streaming (Restreamer)
  # Port 1935 exposed for RTMP ingestion
  # ===========================================

  restreamer:
    image: datarhei/restreamer:2.10.0
    container_name: restreamer
    restart: unless-stopped
    ports:
      - "1935:1935"
    volumes:
      - ./infrastructure/data/restreamer/config:/core/config
      - ./infrastructure/data/restreamer/data:/core/data
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2g
        reservations:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ===========================================
  # BLOCK I - Frontend Web App
  # Static SPA served by nginx, proxied via NPM
  # ===========================================

  pnptv-web:
    image: nginx:alpine
    container_name: pnptv-web
    restart: unless-stopped
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./infrastructure/configs/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pnptvapp_net
    labels:
      traefik.enable: "true"
      traefik.docker.network: "pnptvapp_pnptvapp_net"
      traefik.http.routers.pnptv-web.rule: "Host(`pnptv.app`)"
      traefik.http.routers.pnptv-web.entrypoints: "websecure"
      traefik.http.routers.pnptv-web.tls.certresolver: "letsencrypt"
      traefik.http.services.pnptv-web.loadbalancer.server.port: "80"
      traefik.http.routers.pnptv-app-redirect.rule: "Host(`app.pnptv.app`)"
      traefik.http.routers.pnptv-app-redirect.entrypoints: "websecure"
      traefik.http.routers.pnptv-app-redirect.tls.certresolver: "letsencrypt"
      traefik.http.routers.pnptv-app-redirect.middlewares: "app-to-main@docker"
      traefik.http.routers.pnptv-app-redirect.service: "pnptv-web"
      traefik.http.middlewares.app-to-main.redirectregex.regex: "^https://app\\.pnptv\\.app(.*)"
      traefik.http.middlewares.app-to-main.redirectregex.replacement: "https://pnptv.app$${1}"
      traefik.http.middlewares.app-to-main.redirectregex.permanent: "true"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pnptv-studio:
    image: nginx:alpine
    container_name: pnptv-studio
    restart: unless-stopped
    volumes:
      - ./apps/studio/dist:/usr/share/nginx/html:ro
      - ./infrastructure/configs/studio/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================
  # BLOCK J - Backend Bot + API (Node.js)
  # Dedicated PostgreSQL + Redis for bot/API
  # pg-pnptv has WAL-G continuous backup:
  #   - wal_level=replica + archive_mode=on
  #   - Separate WAL volume (vol_pg_pnptv_wal)
  #   - WAL-G backup volume (vol_pg_pnptv_walg_backups)
  #   - archive_command gracefully no-ops if wal-g
  #     hasn't been bootstrapped yet (first run).
  #     Run scripts/walg-backup.sh once to bootstrap.
  # ===========================================

  pg-pnptv:
    image: postgres:16-alpine
    container_name: pg-pnptv
    restart: unless-stopped
    volumes:
      - vol_pg_pnptv:/var/lib/postgresql/data
      - vol_pg_pnptv_wal:/var/lib/postgresql/wal
      - vol_pg_pnptv_walg_backups:/var/lib/postgresql/walg-backups
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_WALDIR: /var/lib/postgresql/wal
      # WAL-G environment — used by archive_command and wal-g backup-push
      WALG_FILE_PREFIX: /var/lib/postgresql/walg-backups
      WALG_COMPRESSION_METHOD: brotli
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c "archive_command=test -f /usr/local/bin/wal-g && WALG_FILE_PREFIX=/var/lib/postgresql/walg-backups /usr/local/bin/wal-g wal-push %p || true"
      -c max_wal_senders=3
      -c wal_keep_size=256MB
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis-pnptv:
    image: redis:7-alpine
    container_name: redis-pnptv
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PNPTV_PASSWORD} --maxmemory 384mb --maxmemory-policy allkeys-lru
    volumes:
      - vol_redis_pnptv:/data
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PNPTV_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pnptv-bot:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: pnptv-bot:latest
    container_name: pnptv-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"  # Bind to localhost only — no direct external access
    volumes:
      - ./public/uploads:/app/public/uploads
      - /var/www/pnptvbot-sandbox/public/media:/media
      - ./logs:/app/logs
      - ./config/jaas-private-key.pem:/app/config/jaas-private-key.pem:ro
    env_file:
      - .env
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      POSTGRES_HOST: pg-pnptv
      REDIS_HOST: redis-pnptv
      BOT_LOCK_ENABLED: "false"
      BTCPAY_URL: http://btcpay-server:23000
      RESTREAMER_URL: http://restreamer:8080
      RESTREAMER_PUBLIC_URL: https://live.pnptv.app
      RESTREAMER_USER: admin
      RESTREAMER_PASSWORD: ${RESTREAMER_PASSWORD}
    networks:
      - pnptvapp_net
    depends_on:
      pg-pnptv:
        condition: service_healthy
      redis-pnptv:
        condition: service_healthy
      synapse:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ===========================================
  # BLOCK L - Newsletter (Listmonk)
  # Self-hosted email campaigns & mailing lists
  # Admin UI at newsletter.pnptv.app
  # Public subscription API proxied via nginx
  # ===========================================

  pg-listmonk:
    image: postgres:16-alpine
    container_name: pg-listmonk
    restart: unless-stopped
    volumes:
      - vol_pg_listmonk:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: listmonk_db
      POSTGRES_USER: listmonk_user
      POSTGRES_PASSWORD: ${PG_LISTMONK_PASSWORD}
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk_user -d listmonk_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  listmonk:
    image: listmonk/listmonk:latest
    container_name: listmonk
    restart: unless-stopped
    depends_on:
      pg-listmonk:
        condition: service_healthy
    environment:
      LISTMONK_app__address: "0.0.0.0:9000"
      LISTMONK_db__host: pg-listmonk
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: listmonk_user
      LISTMONK_db__password: ${PG_LISTMONK_PASSWORD}
      LISTMONK_db__database: listmonk_db
      LISTMONK_db__ssl_mode: disable
      LISTMONK_app__admin_username: admin
      LISTMONK_app__admin_password: ${LISTMONK_ADMIN_PASSWORD}
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
        reservations:
          cpus: '0.05'
          memory: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ===========================================
  # BLOCK M - Community Feedback (Fider)
  # Self-hosted feature voting & feedback board
  # Exposed at feedback.pnptv.app
  # Embedded as iframe in /support page
  # ===========================================

  pg-fider:
    image: postgres:16-alpine
    container_name: pg-fider
    restart: unless-stopped
    volumes:
      - vol_pg_fider:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: fider_db
      POSTGRES_USER: fider_user
      POSTGRES_PASSWORD: ${PG_FIDER_PASSWORD}
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fider_user -d fider_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  fider:
    image: getfider/fider:stable
    container_name: fider
    restart: unless-stopped
    depends_on:
      pg-fider:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fider_user:${PG_FIDER_PASSWORD}@pg-fider:5432/fider_db?sslmode=disable
      JWT_SECRET: ${FIDER_JWT_SECRET}
      EMAIL_NOREPLY: support@pnptv.app
      EMAIL_SMTP_HOST: smtp.hostinger.com
      EMAIL_SMTP_PORT: "587"
      EMAIL_SMTP_USERNAME: support@pnptv.app
      EMAIL_SMTP_PASSWORD: ${FIDER_SMTP_PASSWORD}
      BASE_URL: https://feedback.pnptv.app
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
        reservations:
          cpus: '0.05'
          memory: 64m
    healthcheck:
      test: ["CMD", "./fider", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  pg-btcpay:
    image: postgres:16-alpine
    container_name: pg-btcpay
    restart: unless-stopped
    volumes:
      - vol_pg_btcpay:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: btcpayserver
      POSTGRES_USER: btcpay
      POSTGRES_PASSWORD: ${BTCPAY_POSTGRES_PASSWORD}
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btcpay -d btcpayserver"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  dashd:
    image: dashpay/dashd:latest
    container_name: dashd
    restart: unless-stopped
    command: dashd
    volumes:
      - ./infrastructure/data/btcpay/dashd:/home/dash/.dashcore
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "dash-cli -conf=/home/dash/.dashcore/dash.conf getblockchaininfo || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s

  btcpay-nbxplorer:
    image: nicolasdorier/nbxplorer:2.5.30
    container_name: btcpay-nbxplorer
    restart: unless-stopped
    volumes:
      - ./infrastructure/data/btcpay/nbxplorer:/datadir
    environment:
      NBXPLORER_NETWORK: mainnet
      NBXPLORER_CHAINS: "DASH"
      NBXPLORER_BIND: 0.0.0.0:24444
      NBXPLORER_DASHNODEENDPOINT: dashd:9999
      NBXPLORER_DASHNODERPCURL: http://dashd:9998/
      NBXPLORER_DASHNODERPCAUTH: ${NBXPLORER_DASH_RPC_AUTH}
      NBXPLORER_POSTGRES: "Host=pg-btcpay;Database=nbxplorer;Username=btcpay;Password=${BTCPAY_POSTGRES_PASSWORD}"
    networks:
      - pnptvapp_net
    depends_on:
      pg-btcpay:
        condition: service_healthy
      dashd:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    # No healthcheck — nbxplorer .NET runtime image has no curl/wget

  btcpay-server:
    image: btcpayserver/btcpayserver:2.3.5
    container_name: btcpay-server
    restart: unless-stopped
    expose:
      - "23000"
    volumes:
      - ./infrastructure/data/btcpay/server:/datadir
      - ./infrastructure/data/btcpay/nbxplorer:/root/.nbxplorer:ro
    environment:
      BTCPAY_POSTGRES: "Host=pg-btcpay;Database=btcpayserver;Username=btcpay;Password=${BTCPAY_POSTGRES_PASSWORD}"
      BTCPAY_NETWORK: mainnet
      BTCPAY_ROOTPATH: /
      BTCPAY_DASHEXPLORERURL: http://btcpay-nbxplorer:24444/
      BTCPAY_BIND: 0.0.0.0:23000
      BTCPAY_CHAINS: "DASH"
      BTCPAY_NBXPLORERDEFAULTCOOKIEFILE: /root/.nbxplorer/Main/.cookie
      BTCPAY_OIDC__ENABLED: "true"
      BTCPAY_OIDC__PROVIDERURL: https://auth.pnptv.app/application/o/btcpay/
      BTCPAY_OIDC__CLIENTID: btcpay
      BTCPAY_OIDC__CLIENTSECRET: "${BTCPAY_OIDC_CLIENT_SECRET}"
    networks:
      - pnptvapp_net
    depends_on:
      - pg-btcpay
      - btcpay-nbxplorer
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    # No healthcheck — BTCPay .NET runtime image has no curl/wget

  # ===========================================
  # BLOCK Z — Developer Tooling
  # All tools are localhost-only (127.0.0.1).
  # Access via SSH tunnel or npm-proxy + Authentik.
  # ===========================================

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "127.0.0.1:8282:8080"
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    networks:
      - pnptvapp_net
    depends_on:
      - docker-socket-proxy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m
    # No healthcheck — dozzle uses a distroless image (no shell/wget/curl)

  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ./infrastructure/data/dockge/data:/app/data
      - ./infrastructure/data/dockge/stacks:/opt/stacks
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks
      DOCKER_HOST: tcp://docker-socket-proxy-rw:2375
    networks:
      - pnptvapp_net
    depends_on:
      - docker-socket-proxy-rw
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: pgweb
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:8081"
    environment:
      PGWEB_DATABASE_URL: ${PGWEB_DB_URL}
    networks:
      - pnptvapp_net
    depends_on:
      - pg-pnptv
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  databasus:
    image: databasus/databasus:latest
    container_name: databasus
    restart: unless-stopped
    ports:
      - "127.0.0.1:8383:4005"
    environment:
      DB_HOST: pg-pnptv
      DB_PORT: 5432
      DB_USER: ${PG_PNPTV_USER}
      DB_PASSWORD: ${PG_PNPTV_PASSWORD}
      DB_NAME: ${PG_PNPTV_DB}
    volumes:
      - ./infrastructure/data/databasus:/backups
    networks:
      - pnptvapp_net
    depends_on:
      - pg-pnptv
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

  pg-infisical:
    image: postgres:16-alpine
    container_name: pg-infisical
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_INFISICAL_USER}
      POSTGRES_PASSWORD: ${PG_INFISICAL_PASSWORD}
      POSTGRES_DB: ${PG_INFISICAL_DB}
    volumes:
      - vol_pg_infisical:/var/lib/postgresql/data
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_INFISICAL_USER} -d ${PG_INFISICAL_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  infisical:
    image: infisical/infisical:latest
    container_name: infisical
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8080"
    environment:
      DB_CONNECTION_URI: "postgres://${PG_INFISICAL_USER}:${PG_INFISICAL_PASSWORD}@pg-infisical:5432/${PG_INFISICAL_DB}"
      REDIS_URL: "redis://:${REDIS_PNPTV_PASSWORD}@redis-pnptv:6379/3"
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      SITE_URL: https://infisical.pnptv.app
      NODE_ENV: production
      SMTP_HOST: smtp.hostinger.com
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USERNAME: ${PNPTV_SMTP_USER}
      SMTP_PASSWORD: ${PNPTV_SMTP_PASS}
      SMTP_FROM_NAME: PNPtv Secrets
      SMTP_FROM_ADDRESS: ${PNPTV_FROM_EMAIL}
      INVITE_ONLY_SIGNUP: "false"
    networks:
      - pnptvapp_net
    depends_on:
      pg-infisical:
        condition: service_healthy
      redis-pnptv:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  pg-hoppscotch:
    image: postgres:16-alpine
    container_name: pg-hoppscotch
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_HOPPSCOTCH_USER}
      POSTGRES_PASSWORD: ${PG_HOPPSCOTCH_PASSWORD}
      POSTGRES_DB: ${PG_HOPPSCOTCH_DB}
    volumes:
      - vol_pg_hoppscotch:/var/lib/postgresql/data
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_HOPPSCOTCH_USER} -d ${PG_HOPPSCOTCH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  hoppscotch:
    image: hoppscotch/hoppscotch:latest
    container_name: hoppscotch
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:3170:3170"
    environment:
      DATABASE_URL: "postgresql://${PG_HOPPSCOTCH_USER}:${PG_HOPPSCOTCH_PASSWORD}@pg-hoppscotch:5432/${PG_HOPPSCOTCH_DB}"
      JWT_SECRET: ${HOPPSCOTCH_JWT_SECRET}
      TOKEN_SALT_COMPLEXITY: 10
      MAGIC_LINK_TOKEN_VALIDITY: 3
      REFRESH_TOKEN_VALIDITY: "604800000ms"
      ACCESS_TOKEN_VALIDITY: "86400000ms"
      SESSION_SECRET: ${HOPPSCOTCH_SESSION_SECRET}
      ALLOW_SECURE_COOKIES: "false"
      VITE_ALLOWED_AUTH_PROVIDERS: "EMAIL"
      VITE_BASE_URL: "http://127.0.0.1:3100"
      VITE_SHORTCODE_BASE_URL: "http://127.0.0.1:3100"
      VITE_BACKEND_GQL_URL: "http://127.0.0.1:3100/backend/graphql"
      VITE_BACKEND_WS_URL: "ws://127.0.0.1:3100/backend/graphql"
      VITE_BACKEND_API_URL: "http://127.0.0.1:3100/backend/v1"
      VITE_APP_TOS_LINK: "https://docs.hoppscotch.io/legal/terms"
      VITE_APP_PRIVACY_POLICY_LINK: "https://docs.hoppscotch.io/legal/privacy"
      MAILER_SMTP_ENABLE: "true"
      MAILER_USE_CUSTOM_CONFIGS: "true"
      MAILER_ADDRESS_FROM: '"PNPtv Tools" <support@pnptv.app>'
      MAILER_SMTP_HOST: "smtp.hostinger.com"
      MAILER_SMTP_PORT: 587
      MAILER_SMTP_SECURE: "false"
      MAILER_SMTP_USER: "support@pnptv.app"
      MAILER_SMTP_PASSWORD: ${HOPPSCOTCH_SMTP_PASSWORD}
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 100
      WHITELISTED_ORIGINS: "http://127.0.0.1:3100,http://localhost:3100"
      DATA_ENCRYPTION_KEY: ${HOPPSCOTCH_DATA_ENCRYPTION_KEY}
    networks:
      - pnptvapp_net
    depends_on:
      pg-hoppscotch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m

  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:80"
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: meilisearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - ./infrastructure/data/meilisearch:/meili_data
    networks:
      - pnptvapp_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
