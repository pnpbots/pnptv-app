port: 7880
bind_addresses:
  - ""
rtc:
  port_range_start: 50000
  port_range_end: 50060
  tcp_port: 7881
  use_external_ip: true
# Placeholders are substituted at container start by the entrypoint
# in docker-compose.yml (livekit service) using env vars LIVEKIT_API_KEY
# and LIVEKIT_API_SECRET from .env. Do NOT commit plaintext keys here.
keys:
  __LIVEKIT_API_KEY__: __LIVEKIT_API_SECRET__
logging:
  level: info
turn:
  # Disabled: LIVEKIT_TURN_DOMAIN is not configured, UFW does not expose 5349,
  # and WebRTC works via UDP 50000-50060 + STUN. Re-enable only after
  # provisioning a TURN domain + TLS cert + opening the port.
  enabled: false
webhook:
  api_key: __LIVEKIT_API_KEY__
  urls:
    - https://pnptv.app/api/webhooks/livekit
