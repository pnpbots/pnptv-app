port: 7880
bind_addresses:
  - ""
rtc:
  port_range_start: 50000
  port_range_end: 50060
  tcp_port: 7881
  use_external_ip: true
# Keys are loaded from environment variables at runtime.
# Set LIVEKIT_API_KEY and LIVEKIT_API_SECRET in the container environment.
# Do NOT add plaintext keys here — rotate immediately if any were committed.
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
logging:
  level: info
turn:
  enabled: true
  # UDP for standard NAT traversal
  udp_port: 3478
  # TLS-TURN is required for strict-NAT / corporate users that block UDP.
  # Clients behind firewalls that only permit 443/TCP will use this port.
  tls_port: 5349
  domain: ${LIVEKIT_TURN_DOMAIN}
  external_tls: true
webhook:
  api_key: ${LIVEKIT_API_KEY}
  urls:
    - https://pnptv.app/api/webhooks/livekit
