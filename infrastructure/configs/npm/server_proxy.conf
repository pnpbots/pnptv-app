# =============================================================================
# ATProto OAuth Public Routes (shared across all proxy hosts)
# =============================================================================
# These paths MUST be publicly accessible (no auth guard) per the ATProto spec.
# Using exact-match (=) locations to avoid conflicts with other proxy hosts.
#
# This file is included via:
#   include /data/nginx/custom/server_proxy[.]conf;
# in every NPM-generated proxy host server block.
#
# Each location declares its own resolver + $atproto_bot upstream variable.
# Declaring the resolver/variable inside each location (rather than relying on
# one declared in pnptv-app-proxy.conf) avoids ordering dependencies between
# include files — this file is self-contained.
#
# Apply with:  scripts/apply-npm-routing.sh
# =============================================================================

# ATProto Client Identity Document
location = /oauth/client-metadata.json {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $atproto_bot http://pnptv-bot:3001;
    proxy_pass $atproto_bot$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Cache-Control "public, max-age=3600" always;
}

# ATProto JWKS
location = /oauth/jwks.json {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $atproto_bot http://pnptv-bot:3001;
    proxy_pass $atproto_bot$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Cache-Control "public, max-age=3600" always;
}

# ATProto Resource Discovery (RFC 9728)
location = /.well-known/oauth-protected-resource {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $atproto_bot http://pnptv-bot:3001;
    proxy_pass $atproto_bot$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Cache-Control "public, max-age=3600" always;
}

# ATProto OAuth login (initiates PKCE flow, redirects to Bluesky PDS)
location = /oauth/login {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $atproto_bot http://pnptv-bot:3001;
    proxy_pass $atproto_bot$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ATProto OAuth callback
location = /oauth/callback {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $atproto_bot http://pnptv-bot:3001;
    proxy_pass $atproto_bot$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
