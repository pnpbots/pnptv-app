server {
    listen 80;
    server_name _;

    # Strip server identity
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed .gz files when available
    gzip_static on;

    # Fallback: on-the-fly gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Never cache index.html so browsers always fetch latest after deploy
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # Cache static assets aggressively (Vite content-hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
        try_files $uri =404;
    }

    # Strip backend identity headers from proxied responses
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # ---- Backend API routes → Node.js (pnptv-bot:3001) ----

    location /api/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_http_version 1.1;
        client_max_body_size 3200m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /socket.io/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /uploads/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /health {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security Headers ────────────────────────────────────────────
    # MIME sniffing protection
    add_header X-Content-Type-Options "nosniff" always;
    # Clickjacking protection (legacy fallback for frame-ancestors 'none' in CSP)
    add_header X-Frame-Options "DENY" always;
    # IE download protection
    add_header X-Download-Options "noopen" always;
    # Referrer leak prevention
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Content Security Policy ──────────────────────────────────
    # script-src: 'unsafe-inline' required by Vite dev HMR + inline event handlers
    # style-src: 'unsafe-inline' required by Tailwind + style injection
    # frame-ancestors 'none': blocks embedding in iframes (replaces X-Frame-Options)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' https: data:; frame-src https:; media-src 'self' https: blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https:;" always;

    # ── Transport Security ───────────────────────────────────────
    # 2 years + preload (matches NPM proxy host config)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Cross-Origin Isolation ───────────────────────────────────
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # ── Permissions Policy ───────────────────────────────────────
    add_header Permissions-Policy "camera=(self \"https://8x8.vc\" \"https://meet.jit.si\"), microphone=(self \"https://8x8.vc\" \"https://meet.jit.si\"), geolocation=(self), display-capture=(self \"https://8x8.vc\" \"https://meet.jit.si\"), screen-wake-lock=(self), clipboard-write=(self \"https://8x8.vc\" \"https://meet.jit.si\"), speaker-selection=(self \"https://8x8.vc\" \"https://meet.jit.si\"), autoplay=(self \"https://8x8.vc\" \"https://meet.jit.si\")" always;
}
