# Detect social media and search engine crawlers by User-Agent.
# Crawlers are proxied to the backend OG endpoint for dynamic Open Graph meta tags.
# Normal users hit the SPA as usual via try_files.
map $http_user_agent $is_crawler {
    default                     0;
    ~*Twitterbot                1;
    ~*facebookexternalhit       1;
    ~*LinkedInBot               1;
    ~*Googlebot                 1;
    ~*bingbot                   1;
    ~*Slackbot                  1;
    ~*Discordbot                1;
    ~*WhatsApp                  1;
    ~*TelegramBot               1;
    ~*Applebot                  1;
    ~*Pinterestbot              1;
    ~*redditbot                 1;
}

server {
    listen 80;
    server_name _;

    # Strip server identity
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed .gz files when available (zero CPU overhead)
    gzip_static on;

    # Fallback: on-the-fly gzip for non-precompressed responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Element Web (Matrix chat client) — ^~ prevents regex locations from
    # intercepting /element/*.js requests that would otherwise hit try_files =404
    location ^~ /element/ {
        proxy_pass http://element-web:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Inject <base href> so Element's relative URLs and SSO redirects work at /element/
        sub_filter '<head>' '<head><base href="/element/">';
        sub_filter_once on;
        sub_filter_types text/html;

        # Override server-level security headers for Element Web.
        # Element has its own CSP via <meta> tag; pnptv-web's CSP blocks
        # its WASM crypto, web workers, and connect-src to Matrix homeserver.
        # Setting add_header inside a location block replaces ALL inherited
        # server-level add_header directives (nginx behavior).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Never cache index.html or manifest.json so browsers always fetch the
    # latest entry point after a deploy. JS/CSS assets are safe to cache
    # forever because Vite appends content-hashes to their filenames.
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # Service worker must never be cached — browser needs to re-check on every load
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # Cache static assets aggressively (Vite content-hashed filenames are safe)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
        try_files $uri =404;
    }

    # Strip backend identity headers from proxied responses
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # ---- Backend API routes → Node.js (pnptv-bot:3001) ----

    location /api/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_http_version 1.1;
        client_max_body_size 3200m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # OIDC callback — serve SPA (not backend)
    location = /auth/callback {
        try_files /index.html =404;
    }
    location = /auth/silent-renew {
        try_files /index.html =404;
    }

    location /auth/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /pnp/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /webhook/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /socket.io/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /uploads/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /health {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /checkout/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /payment/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /daimo-checkout/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /join-group/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /monitoring {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Token checkout — always proxy to backend so the self-contained HTML page
    # (with ePayco/Daimo SDKs) is served for external redirects from payment providers.
    location /token-checkout/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # OG meta tag endpoint — always proxy to backend regardless of user agent.
    # The backend generates full HTML with dynamic Open Graph tags per resource.
    # Both pnptv-web and pnptv-bot are on proxy_net, so the hostname resolves.
    location /og/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Shareable content routes — crawler detection and conditional proxying.
    # When $is_crawler = 1: rewrite to /og<original_path> and proxy to backend,
    # which returns a server-rendered HTML page with correct Open Graph meta tags.
    # When $is_crawler = 0: fall through to try_files and serve the SPA normally.
    #
    # NOTE: proxy_set_header is not allowed inside an `if` block in nginx.
    # Headers are set at the location level so they apply to all proxy_pass
    # calls within this block (including those triggered by the `if`).
    # try_files is only reached when $is_crawler = 0 (normal user traffic).
    location ~ ^/(social/post|profile|u|live|stream|page|terms|privacy|cookies|community-guidelines|content-policy|refunds|subscriptions|creator-terms|dmca|safety|contact)(/|$) {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        if ($is_crawler) {
            rewrite ^(.*)$ /og$1 break;
            proxy_pass http://pnptv-bot:3001;
        }
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback: serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security Headers ────────────────────────────────────────────
    # MIME sniffing protection
    add_header X-Content-Type-Options "nosniff" always;
    # Clickjacking protection — allow self-framing for embedded Element Web
    add_header X-Frame-Options "SAMEORIGIN" always;
    # IE download protection
    add_header X-Download-Options "noopen" always;
    # Referrer leak prevention
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Content Security Policy ──────────────────────────────────
    # script-src: 'unsafe-inline' required by Vite dev HMR + inline event handlers
    # style-src: 'unsafe-inline' required by Tailwind + style injection
    # frame-ancestors 'none': blocks embedding in iframes (replaces X-Frame-Options)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' https: data:; frame-src 'self'; media-src 'self' https: blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https:;" always;

    # ── Transport Security ───────────────────────────────────────
    # 2 years + preload (matches NPM proxy host config)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Cross-Origin Isolation ───────────────────────────────────
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # ── Permissions Policy ───────────────────────────────────────
    add_header Permissions-Policy "camera=(self \"https://8x8.vc\" \"https://meet.jit.si\"), microphone=(self \"https://8x8.vc\" \"https://meet.jit.si\"), geolocation=(self), display-capture=(self \"https://8x8.vc\" \"https://meet.jit.si\"), screen-wake-lock=(self), clipboard-write=(self \"https://8x8.vc\" \"https://meet.jit.si\"), speaker-selection=(self \"https://8x8.vc\" \"https://meet.jit.si\"), autoplay=(self \"https://8x8.vc\" \"https://meet.jit.si\")" always;
}
