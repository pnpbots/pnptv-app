# Detect social media and search engine crawlers by User-Agent.
# Crawlers are proxied to the backend OG endpoint for dynamic Open Graph meta tags.
# Normal users hit the SPA as usual via try_files.
map $http_user_agent $is_crawler {
    default                     0;
    ~*Twitterbot                1;
    ~*facebookexternalhit       1;
    ~*LinkedInBot               1;
    ~*Googlebot                 1;
    ~*bingbot                   1;
    ~*Slackbot                  1;
    ~*Discordbot                1;
    ~*WhatsApp                  1;
    ~*TelegramBot               1;
    ~*Applebot                  1;
    ~*Pinterestbot              1;
    ~*redditbot                 1;
}

server {
    listen 80;
    server_name _;

    # Strip server identity
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed .gz files when available (zero CPU overhead)
    gzip_static on;

    # Fallback: on-the-fly gzip for non-precompressed responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Directus CMS API — use Docker DNS resolver for lazy resolution so
    # Nginx starts even when the directus container is not running.
    location /cms/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $directus_upstream http://directus:8055;
        proxy_pass $directus_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    # Element Web (Matrix chat client) — ^~ prevents regex locations from
    # intercepting /element/*.js requests that would otherwise hit try_files =404
    location ^~ /element/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $element_upstream http://element-web:80;
        rewrite ^/element/(.*)$ /$1 break;
        proxy_pass $element_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Inject <base href>, PNPtv fonts, colors, and UI overrides
        sub_filter '<head>' '<head><base href="/element/"><link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>*{font-family:"Roboto Mono",monospace!important}body,html{background:#121212!important}.mx_LeftPanel,.mx_LeftPanel_outerWrapper,.mx_SpacePanel{display:none!important}.mx_RoomView{background:#121212!important;max-width:100%!important;width:100%!important}.mx_MainSplit>div:first-child{flex:1!important}.mx_RoomHeader,.mx_MessageComposer{background:#1E1E1E!important;border-color:#2A2A2A!important}.mx_EventTile{background:transparent!important}.mx_Dialog,.mx_ContextMenu{background:#1E1E1E!important;border-color:#2A2A2A!important}.mx_BasicMessageComposer,.mx_SendMessageComposer textarea{background:#121212!important;color:#FFFFFF!important}::selection{background:#D4007A!important}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#121212}::-webkit-scrollbar-thumb{background:#2A2A2A;border-radius:2px}::-webkit-scrollbar-thumb:hover{background:#D4007A}</style>';
        sub_filter_once on;

        # Override server-level security headers for Element Web.
        # Element has its own CSP via <meta> tag; pnptv-web's CSP blocks
        # its WASM crypto, web workers, and connect-src to Matrix homeserver.
        # Setting add_header inside a location block replaces ALL inherited
        # server-level add_header directives (nginx behavior), so we must
        # re-add the headers we still want (HSTS, Referrer-Policy, etc.).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self \"https://8x8.vc\"), microphone=(self \"https://8x8.vc\"), geolocation=(self), display-capture=(self \"https://8x8.vc\"), screen-wake-lock=(self), clipboard-write=(self \"https://8x8.vc\"), speaker-selection=(self \"https://8x8.vc\"), autoplay=(self \"https://8x8.vc\")" always;
    }

    # Never cache index.html or manifest.json so browsers always fetch the
    # latest entry point after a deploy. JS/CSS assets are safe to cache
    # forever because Vite appends content-hashes to their filenames.
    #
    # NGINX QUIRK: any add_header inside a location block REPLACES every
    # add_header inherited from the server scope. The server-scope CSP /
    # HSTS / X-Content-Type-Options / etc. would otherwise vanish on
    # *.html responses (including the SPA's index.html served via try_files
    # fallback in `location /`). We re-emit them here to keep the SPA
    # protected — and, critically, to keep the ePayco frame-src wildcard
    # active so the React payment pages (Stream / TokenCheckout) can open
    # the ePayco modal + 3DS bank challenge iframes.
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Download-Options "noopen" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' https: data:; frame-src 'self' https://feedback.pnptv.app https://booking.pnptv.app https://*.epayco.co https://*.epayco.com https://*.epayco.io https://*.payco.co https://*.cardinalcommerce.com https:; media-src 'self' https: blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https:;" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Permissions-Policy "camera=(self \"https://8x8.vc\"), microphone=(self \"https://8x8.vc\"), geolocation=(self), display-capture=(self \"https://8x8.vc\"), screen-wake-lock=(self), clipboard-write=(self \"https://8x8.vc\"), speaker-selection=(self \"https://8x8.vc\"), autoplay=(self \"https://8x8.vc\")" always;
        expires 0;
        try_files $uri =404;
    }

    # Service worker must never be cached — browser needs to re-check on every load
    # (Same nginx add_header inheritance quirk as the .html location above —
    # mirror the same security-header set so sw.js doesn't ship without CSP.)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' https: data:; frame-src 'self' https://feedback.pnptv.app https://booking.pnptv.app https://*.epayco.co https://*.epayco.com https://*.epayco.io https://*.payco.co https://*.cardinalcommerce.com https:; media-src 'self' https: blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https:;" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        expires 0;
        try_files $uri =404;
    }

    # Cache static assets aggressively (Vite content-hashed filenames are safe)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
        try_files $uri =404;
    }

    # Strip backend identity headers from proxied responses
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # ---- Docker DNS resolver + upstream variable ----
    # Using a variable in proxy_pass forces lazy, per-request name resolution
    # via the Docker embedded DNS server (127.0.0.11), so restarts of
    # pnptv-bot (which may change its container IP) don't leave this Nginx
    # pinned to a stale cached IP. Without this, every /api/* request returns
    # 502 until `docker exec pnptv-web nginx -s reload`. See 2026-04-19 outage.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $bot_backend http://pnptv-bot:3001;

    # ---- Backend API routes → Node.js (pnptv-bot:3001) ----

    # Listmonk public subscription API — proxied to avoid CORS from the SPA.
    # Only the /api/public/ subset is exposed; admin UI is on newsletter.pnptv.app.
    location /api/newsletter/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $listmonk_upstream http://listmonk:9000;
        rewrite ^/api/newsletter/(.*)$ /api/public/$1 break;
        proxy_pass $listmonk_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # HLS live stream proxy — disable response buffering so .m3u8 playlists and
    # .ts segments stream directly to the player without nginx accumulating the
    # full segment before forwarding. This removes ~50-200ms per segment.
    # Must appear before the generic /api/ block (nginx uses longest-prefix match).
    location /api/proxy/live/hls/ {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        # Short timeouts: segments are 2 s; 10 s is generous headroom.
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location /api/ {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_http_version 1.1;
        client_max_body_size 3200m;
        proxy_request_buffering off;
        # Generous timeouts for large creator video uploads (up to 2 GB).
        client_body_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OIDC callback — serve SPA (not backend)
    location = /auth/callback {
        try_files /index.html =404;
    }
    location = /auth/silent-renew {
        try_files /index.html =404;
    }

    # /login is served by the React SPA (LoginPage.tsx has passkey + magic-link + Telegram widget).
    # The old backend HTML entry is still reachable at /classic-login for fallback use.
    location = /login {
        try_files /index.html =404;
    }
    location = /classic-login {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Legacy marketing entry — hard-redirect to the real login screen so
    # stale PWAs / bookmarked routes cannot reopen the old landing page.
    location = /landing {
        return 302 /login;
    }

    location /auth/ {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /pnp/ {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /webhook/ {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /socket.io/ {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /uploads/ {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /health {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /checkout/ {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /payment/ {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /daimo-checkout/ {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /join-group/ {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /monitoring {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Token checkout — always proxy to backend so the self-contained HTML page
    # (with ePayco/Daimo SDKs) is served for external redirects from payment providers.
    location /token-checkout/ {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # OG meta tag endpoint — always proxy to backend regardless of user agent.
    # The backend generates full HTML with dynamic Open Graph tags per resource.
    # Both pnptv-web and pnptv-bot are on proxy_net, so the hostname resolves.
    location /og/ {
        proxy_pass $bot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Shareable content routes — crawler detection and conditional proxying.
    # When $is_crawler = 1: rewrite to /og<original_path> with `last` flag so
    # nginx restarts location matching and hits the existing `location /og/` block,
    # which proxies to the backend for dynamic Open Graph meta tags.
    # When $is_crawler = 0: try_files serves the SPA normally.
    #
    # NOTE: proxy_pass inside an `if` block is invalid in nginx ("if is evil") and
    # causes try_files to silently fail for non-crawlers. Using `rewrite ... last`
    # inside `if` is safe and delegates to the /og/ proxy location instead.
    location ~ ^/(social/post|profile|u|v|creator|live|main-stage|h|stream|page|channels|terms|privacy|cookies|community-guidelines|content-policy|refunds|subscriptions|creator-terms|dmca|safety|contact)(/|$) {
        if ($is_crawler) {
            rewrite ^(.*)$ /og$1 last;
        }
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback: serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security Headers ────────────────────────────────────────────
    # MIME sniffing protection
    add_header X-Content-Type-Options "nosniff" always;
    # Clickjacking protection — allow self-framing for embedded Element Web
    add_header X-Frame-Options "SAMEORIGIN" always;
    # IE download protection
    add_header X-Download-Options "noopen" always;
    # Referrer leak prevention
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Content Security Policy ──────────────────────────────────
    # script-src: 'unsafe-inline' required by Vite dev HMR + inline event handlers;
    #             https: covers ePayco SDK loaded by Stream.tsx / TokenCheckout.tsx
    # style-src:  'unsafe-inline' required by Tailwind + style injection
    # frame-src:  must allow ePayco/Cardinal modal + 3DS bank-challenge iframes
    #             (issuer banks like bancolombia/davivienda use unknowable hosts),
    #             so explicit ePayco/payco/cardinalcommerce domains plus https:
    #             matches the backend CHECKOUT_CSP wildcard used at /payment/:id.
    #             Without https: here, any ePayco modal opened from the SPA had
    #             its 3DS iframe silently blocked. See routes.js CHECKOUT_CSP.
    # frame-ancestors 'self': blocks embedding this app in foreign iframes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' https: data:; frame-src 'self' https://feedback.pnptv.app https://booking.pnptv.app https://*.epayco.co https://*.epayco.com https://*.epayco.io https://*.payco.co https://*.cardinalcommerce.com https:; media-src 'self' https: blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https:;" always;

    # ── Transport Security ───────────────────────────────────────
    # 2 years + preload (matches NPM proxy host config)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Cross-Origin Isolation ───────────────────────────────────
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # ── Permissions Policy ───────────────────────────────────────
    add_header Permissions-Policy "camera=(self \"https://8x8.vc\"), microphone=(self \"https://8x8.vc\"), geolocation=(self), display-capture=(self \"https://8x8.vc\"), screen-wake-lock=(self), clipboard-write=(self \"https://8x8.vc\"), speaker-selection=(self \"https://8x8.vc\"), autoplay=(self \"https://8x8.vc\")" always;
}
