# Detect social media and search engine crawlers by User-Agent.
# Crawlers are proxied to the backend OG endpoint for dynamic Open Graph meta tags.
# Normal users hit the SPA as usual via try_files.
map $http_user_agent $is_crawler {
    default                     0;
    ~*Twitterbot                1;
    ~*facebookexternalhit       1;
    ~*LinkedInBot               1;
    ~*Googlebot                 1;
    ~*bingbot                   1;
    ~*Slackbot                  1;
    ~*Discordbot                1;
    ~*WhatsApp                  1;
    ~*TelegramBot               1;
    ~*Applebot                  1;
    ~*Pinterestbot              1;
    ~*redditbot                 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed .gz files when available (zero CPU overhead)
    gzip_static on;

    # Fallback: on-the-fly gzip for non-precompressed responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Never cache index.html or manifest.json so browsers always fetch the
    # latest entry point after a deploy. JS/CSS assets are safe to cache
    # forever because Vite appends content-hashes to their filenames.
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
        try_files $uri =404;
    }

    # Token checkout — always proxy to backend so the self-contained HTML page
    # (with ePayco/Daimo SDKs) is served for external redirects from payment providers.
    location /token-checkout/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OG meta tag endpoint — always proxy to backend regardless of user agent.
    # The backend generates full HTML with dynamic Open Graph tags per resource.
    # Both pnptv-web and pnptv-bot are on pnptvapp_net, so the hostname resolves.
    location /og/ {
        proxy_pass http://pnptv-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shareable content routes — crawler detection and conditional proxying.
    # When $is_crawler = 1: rewrite to /og<original_path> and proxy to backend,
    # which returns a server-rendered HTML page with correct Open Graph meta tags.
    # When $is_crawler = 0: fall through to try_files and serve the SPA normally.
    #
    # NOTE: proxy_set_header is not allowed inside an `if` block in nginx.
    # Headers are set at the location level so they apply to all proxy_pass
    # calls within this block (including those triggered by the `if`).
    # try_files is only reached when $is_crawler = 0 (normal user traffic).
    location ~ ^/(social/post|profile|u|live|stream|page|terms|privacy|cookies|community-guidelines|content-policy|refunds|subscriptions|creator-terms|dmca|safety|contact)(/|$) {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($is_crawler) {
            rewrite ^(.*)$ /og$1 break;
            proxy_pass http://pnptv-bot:3001;
        }
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback: serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' https: data:; frame-src https:; media-src 'self' https: blob:; worker-src 'self' blob:; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self \"https://8x8.vc\" \"https://meet.jit.si\"), microphone=(self \"https://8x8.vc\" \"https://meet.jit.si\"), geolocation=(self), display-capture=(self \"https://8x8.vc\" \"https://meet.jit.si\"), screen-wake-lock=(self), clipboard-write=(self \"https://8x8.vc\" \"https://meet.jit.si\"), speaker-selection=(self \"https://8x8.vc\" \"https://meet.jit.si\"), autoplay=(self \"https://8x8.vc\" \"https://meet.jit.si\")" always;
}
